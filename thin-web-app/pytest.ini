[pytest]
testpaths = tests
# Collect only the PRD acceptance suites. The pre-existing scripts
# (test_member_recon.py, test_first_dashboard_cascading_filters.py, ...) are
# standalone __main__ programs that fire network calls on import; they are run
# directly, not through pytest, until US-7.1 supersedes them.
python_files = test_us_*.py
addopts = -q --strict-markers
markers =
    live_cube: requires CUBEJS_API_SECRET and a reachable scbi-cube
    live_lake: requires GCS HMAC credentials in the environment
